<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="container">
        <div class="display-container">
            <input id="display" class="display" value="" readonly/>
        </div>
        <div class="button-container">
            <button class="operation" onclick="displayAppend('+')">+</button>
            <button class="number" onclick="displayAppend('7')">7</button>
            <button class="number" onclick="displayAppend('8')">8</button>
            <button class="number" onclick="displayAppend('9')">9</button>
            <button class="operation" onclick="displayAppend('-')">-</button>
            <button class="number" onclick="displayAppend('4')">4</button>
            <button class="number" onclick="displayAppend('5')">5</button>
            <button class="number" onclick="displayAppend('6')">6</button>
            <button class="operation" onclick="displayAppend('*')">*</button>
            <button class="number" onclick="displayAppend('1')">1</button>
            <button class="number" onclick="displayAppend('2')">2</button>
            <button class="number" onclick="displayAppend('3')">3</button>
            <button class="operation" onclick="displayAppend('/')">/</button>
            <button class="number" onclick="displayAppend('0')">0</button>
            <button class="dot" onclick="displayAppend('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
            <button class="clear" onclick="displayClear()">C</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
