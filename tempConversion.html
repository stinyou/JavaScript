<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="tempConversion.css">
</head>
<body>
    <h1>Temperature Conversion:</h1>
    <div class="container">
        <input type="text" class="inputText" id="inputTemp">
        <p><input type="radio" class="selectConversion" name="conversionOption" id="toFahrenheit">Celsius to Fahrenheit</p>
        <p><input type="radio" class="selectConversion" name="conversionOption" id="toCelsius">Fahrenheit to Celsius</p>
        <input type="submit" class="submitButton" id="submitButton">
    </div>
    <p classname="outputText" id="outputTemp"></p>
    <script src="tempConversion.js"></script>
</body>
</html>
